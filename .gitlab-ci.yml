image: node:lts

variables:
  GIT_SUBMODULE_STRATEGY: none
  npm_config_fetch_retry_maxtimeout: 600000

pages:
  stage: deploy
  script:
    - npm ci
    - npm run build
    - rm -rf public
    - mv dist public
    - cp -r AxMirrors public  
  artifacts:
    paths:
      - public
  only:
    - main
